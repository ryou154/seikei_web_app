<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>問い合わせ管理 | MEYLON</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="sidebar.js" defer></script>
</head>
<body class="admin-dashboard-page admin-sub-page">
  <button id="admin-sidebar-toggle" class="admin-sidebar-toggle" type="button" aria-label="管理メニューを開く" aria-expanded="false"><span></span><span></span><span></span></button>
  <aside class="admin-sidebar" aria-label="管理メニュー">
    <div class="admin-sidebar-brand"><span class="admin-card-kicker">MEYLON</span><strong>管理画面</strong></div>
    <nav>
      <a class="admin-sidebar-link" href="index.html">ダッシュボード</a>
      <a class="admin-sidebar-link" href="clinics.html">クリニック管理</a>
      <a class="admin-sidebar-link" href="api-usage.html">API使用料</a>
      <a class="admin-sidebar-link" href="blocked-words.html">禁止ワード</a>
      <a class="admin-sidebar-link is-active" href="inquiries.html">問い合わせ</a>
    </nav>
  </aside>
  <div id="admin-sidebar-overlay" class="admin-sidebar-overlay" hidden></div>
  <main class="admin-sub-content">
    <a class="admin-back-link" href="index.html">管理画面へ戻る</a>
    <p class="eyebrow">INQUIRIES</p>
    <h1>問い合わせ管理</h1>
    <p class="lead">問い合わせ内容を確認し、この画面からユーザーへ回答できます。</p>
    <div class="inquiry-toolbar">
      <select id="inquiry-status" aria-label="回答状態">
        <option value="unanswered">未回答</option><option value="answered">回答済み</option><option value="all">すべて</option>
      </select>
      <select id="inquiry-category" aria-label="カテゴリー">
        <option value="all">すべてのカテゴリー</option><option value="operation">使い方</option><option value="simulation">シミュレーション</option><option value="account">アカウント</option><option value="billing">料金・プラン</option><option value="clinic">クリニック情報</option><option value="bug">不具合</option><option value="other">その他</option>
      </select>
      <select id="inquiry-sort" aria-label="並び順">
        <option value="oldest">古い順</option><option value="newest">新しい順</option>
      </select>
    </div>
    <p id="inquiry-status-message" class="admin-inline-status" role="status"></p>
    <div id="inquiry-list" class="inquiry-list"></div>
  </main>
  <script type="module" src="../auth-core.js"></script>
  <script src="inquiries.js"></script>
</body>
</html>
