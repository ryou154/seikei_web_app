<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 | MEYLON</title>
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../navigation.css"><link rel="stylesheet" href="admin.css">
  <script src="../navigation.js" defer></script>
</head>
<body class="admin-dashboard-page">
  <button id="admin-sidebar-toggle" class="admin-sidebar-toggle" type="button" aria-label="管理メニューを開く" aria-expanded="false"><span></span><span></span><span></span></button>
  <aside id="admin-sidebar" class="admin-sidebar" aria-label="管理メニュー">
    <div class="admin-sidebar-brand"><span class="admin-card-kicker">MEYLON</span><strong>管理画面</strong></div>
    <nav>
      <a class="admin-sidebar-link is-active" href="#admin-home">ダッシュボード</a>
      <a class="admin-sidebar-link" href="../admin-clinics.html">クリニック管理</a>
      <a class="admin-sidebar-link" href="#api-usage">API使用料</a>
      <a class="admin-sidebar-link" href="#blocked-words-panel">禁止ワード</a>
    </nav>
    <button id="admin-logout" class="sub-button" type="button">ログアウト</button>
  </aside>
  <div id="admin-sidebar-overlay" class="admin-sidebar-overlay" hidden></div>
  <header id="admin-home" class="app-header admin-dashboard-header"><p class="eyebrow">ADMIN CONSOLE</p><h1>管理画面</h1><p class="lead">管理者権限を持つアカウント専用の設定画面です。</p></header>
  <main id="admin-content" class="admin-dashboard" hidden>
    <p id="admin-status" class="admin-dashboard-status" role="status" aria-live="polite"></p>
    <section class="admin-card-grid" aria-label="管理メニュー">
      <a class="admin-card" href="../admin-clinics.html"><span class="admin-card-kicker">CLINICS</span><strong>クリニック管理</strong><span>公開情報、施術、料金、公式情報を確認・編集します。</span></a>
      <section id="api-usage" class="admin-card admin-card-muted api-usage-panel"><span class="admin-card-kicker">API USAGE</span><strong>API使用料</strong><div class="usage-metrics"><div><span>Gemini API</span><strong>未接続</strong></div><div><span>Google Places API</span><strong>未接続</strong></div><div><span>今月の推定額</span><strong>--</strong></div></div><p>請求額の集計機能は後から接続できます。現在はGoogle Cloudの請求レポートで確認してください。</p></section>
      <section id="blocked-words-panel" class="admin-card admin-settings-card"><span class="admin-card-kicker">SAFETY</span><strong>禁止ワード</strong><label for="blocked-words">1行に1語</label><textarea id="blocked-words" rows="5" placeholder="例：治療効果を保証"></textarea><button id="save-blocked-words" type="button">禁止ワードを保存</button><span id="blocked-words-status" class="admin-inline-status" role="status"></span></section>
    </section>
    <button id="admin-logout" class="sub-button" type="button">ログアウト</button>
  </main>
  <script type="module" src="../auth-core.js"></script><script type="module" src="admin.js"></script>
</body>
</html>
