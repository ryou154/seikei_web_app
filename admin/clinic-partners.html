<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>クリニック担当者の承認 | MEYLON</title>
    <link rel="stylesheet" href="/clinic-portal-demo.css" />
    <link rel="stylesheet" href="/clinic-booking-demo.css" />
    <script type="module" src="/admin/clinic-partners.js"></script>
  </head>
  <body>
    <header class="booking-user-header">
      <a class="brand" href="/admin/">MEYLON<span>ADMIN</span></a
      ><a href="/admin/">管理画面へ戻る</a>
    </header>
    <main class="booking-user-main">
      <h1>クリニック担当者の承認</h1>
      <p id="auth-status" role="status">管理者権限を確認しています…</p>
      <div id="app-content" hidden>
        <p id="approval-status" role="status"></p>
        <button id="reload-applications" class="button secondary" type="button">
          申請を更新
        </button>
        <div id="approval-list"></div>
        <section class="card">
          <h2>担当者の権限解除</h2>
          <form id="revoke-partner-form">
            <label>担当者UID<input name="uid" required maxlength="128" /></label
            ><button class="button secondary" type="submit">
              クリニック管理権限を解除する
            </button>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
