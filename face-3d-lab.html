<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顔3D ローカル試作</title><link rel="stylesheet" href="/face-3d-lab.css"><main><p class="tag">LOCAL PROTOTYPE</p><h1>整形後の顔を3Dで確認</h1><p>ドラッグで回転できます。初期表示はサンプル形状です。</p><div class="layout"><div id="stage" tabindex="0" aria-label="顔の3D表示。矢印キーで回転"></div><aside><h2>画像と形状</h2><label>Before写真<input id="before" type="file" accept="image/*"></label><label>After写真（任意）<input id="after" type="file" accept="image/*"></label><p>写真の解析はブラウザー内で行います。解析用モデルは外部からダウンロードします。</p><div id="controls"></div><div class="buttons"><button id="front">正面に戻す</button><button id="wire">ワイヤー表示</button><button id="export">GLB保存</button><button id="reset">写真を消してサンプルへ</button></div><p id="status" role="status">サンプルを表示しています。</p></aside></div><p class="note">これは顔表面の試作モデルです。奥行きや見えない部分は推定で、頭全体の再現や手術結果の予測を保証するものではありません。</p></main><script src="/face-analysis.js"></script><script src="/face-3d-canonical.js"></script><script src="/face-3d-model.js"></script><script type="module" src="/face-3d-lab.js"></script></html>
