<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘルプ | MEYLON</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="help.css"><script src="navigation.js" defer></script></head><body class="help-page"><div id="common-navigation"></div><main class="help-shell"><header class="help-header"><p class="section-kicker">HELP</p><h1>ヘルプ</h1><p>よくあるご質問を確認したり、お問い合わせを送信できます。</p></header><section class="help-section"><h2>よくあるご質問</h2><details open><summary>シミュレーション画像は保存できますか？</summary><p>結果画面の保存設定を有効にすると、履歴画面から確認できます。</p></details><details><summary>ログインできない場合はどうすればよいですか？</summary><p>登録したメールアドレスを確認し、確認メールのリンクを開いてから再度ログインしてください。</p></details><details><summary>保存した履歴を削除できますか？</summary><p>マイページの保存データ管理から削除できます。</p></details></section><section class="help-section"><h2>お問い合わせ</h2><form id="contact-form" class="contact-form"><label>件名<input id="contact-subject" maxlength="120" required></label><label>内容<textarea id="contact-message" rows="7" maxlength="4000" required></textarea></label><button type="submit">問い合わせを送信</button><p id="contact-status" role="status"></p></form></section></main><script type="module" src="auth-core.js"></script><script src="help.js"></script></body></html>
