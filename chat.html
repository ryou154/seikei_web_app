<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チャット相談 | MEYLON</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="chat.css"></head><body class="app-page"><div id="common-navigation"></div><main class="layout chat-layout" id="chat-content" hidden><section class="panel chat-panel"><div class="chat-heading"><div><p class="section-kicker">AI CONSULTATION</p><h1>整形・美容医療の相談</h1><p>MEYLON AIが希望や悩みを整理し、施術選びのヒントをご案内します。</p></div><div class="chat-ai-badge"><span>✦</span><strong>MEYLON AI</strong><small>相談アシスタント</small></div></div><div class="chat-safety">診断・効果の保証は行いません。最終的な判断は医師にご相談ください。</div><div id="chat-messages" class="chat-messages" aria-live="polite"></div><div class="quick-prompts" aria-label="相談のきっかけ"><span>相談のきっかけ</span><button type="button" data-prompt="鼻の形や高さについて相談したい">鼻について</button><button type="button" data-prompt="二重や目元の印象について相談したい">目元について</button><button type="button" data-prompt="輪郭やフェイスラインについて相談したい">輪郭について</button><button type="button" data-prompt="自然な変化になる施術を相談したい">自然な変化</button></div><form id="chat-form" class="chat-composer"><textarea id="chat-input" rows="2" maxlength="2000" required placeholder="相談したいことを入力してください…"></textarea><div class="chat-composer-tools"><label class="chat-attach"><input id="chat-image" type="file" accept="image/jpeg,image/png,image/webp"><span>画像を添付</span></label><small>顔画像は施術候補の整理にのみ使用します。</small><button type="submit">送信 <span aria-hidden="true">↑</span></button></div><p id="chat-status" role="status"></p></form><div id="chat-summary" class="chat-summary" hidden><strong>相談内容を整理しました</strong><p>この内容でシミュレーションを行いますか？</p><div><button type="button" id="chat-simulate">シミュレーションへ進む</button><button type="button" id="chat-summary-close" class="sub-button">あとで</button></div></div></section></main><script src="navigation.js" defer></script><script type="module" src="auth-core.js"></script><sc
