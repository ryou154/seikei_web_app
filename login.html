<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ログイン | AI骨格フィット・整形シミュレーター</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="navigation.css"><script src="navigation.js" defer></script></head>
<body class="login-page"><div id="common-navigation"></div><header class="app-header"><p class="eyebrow">Face Design Match</p><h1>AI骨格フィット・整形シミュレーター</h1><p class="lead">ログインしてシミュレーションを開始してください。</p></header><main><section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title"><h2 id="auth-title">ログイン</h2><p>チームで登録したメールアドレスを使用してください。</p><p id="auth-status" role="status" aria-live="polite">ログイン機能を読み込んでいます…</p><fieldset id="auth-controls" disabled><div id="auth-signed-out"><button id="google-login" type="button">Googleでログイン</button><form id="email-login-form"><label class="field"><span>メールアドレス</span><input id="auth-email" type="email" autocomplete="username" required></label><label class="field"><span>パスワード</span><input id="auth-password" type="password" autocomplete="current-password" required></label><div class="auth-buttons"><button type="submit">メールでログイン</button><button id="email-register" type="button" class="sub-button">新規登録</button><button id="password-reset" type="button" class="sub-button">パスワードを忘れた方</button></div><p class="small">新規登録のパスワードは8文字以上です。登録後、届いたメールで本人確認してください。</p></form></div><div id="auth-signed-in" hidden><p id="auth-account"></p><div id="verification-actions" hidden class="auth-buttons"><button id="verification-send" type="button">確認メールを送る</button><button id="verification-check" type="button" class="sub-button">メール確認後に続ける</button></div><button id="logout" type="button" class="sub-button">ログアウト・アカウントを切り替える</button></div></fieldset></section></main><script type="module" src="auth-client.js"></script></body></html>
